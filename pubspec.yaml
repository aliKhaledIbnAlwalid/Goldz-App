name: goldz
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Dependency injection
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Networking
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  # Functional error handling
  dartz: ^0.10.1

  # Local database
  hive_flutter: ^1.0.1

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.2.0
  # Security
  flutter_secure_storage: ^10.0.0

  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.3
  shimmer: ^3.0.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  flutter_native_splash: ^2.4.8
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  injectable_generator: ^2.6.2
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.1
  mockito: ^5.4.4
flutter:
  uses-material-design: true
  assets:
    - assets/

